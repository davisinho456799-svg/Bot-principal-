openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: season
    description: Current anime and manga season data
  - name: discord
    description: Discord bot configuration and synchronization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /season/current:
    get:
      operationId: getCurrentSeason
      tags: [season]
      summary: Get current anime and manga season
      responses:
        "200":
          description: Current season catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonCatalog"
  /discord/guilds:
    get:
      operationId: listDiscordGuilds
      tags: [discord]
      summary: List servers available to the bot
      responses:
        "200":
          description: Discord servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscordGuild"
  /discord/guilds/{guildId}/channels:
    get:
      operationId: listDiscordChannels
      tags: [discord]
      summary: List text channels in a server
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Text channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscordChannel"
  /discord/config:
    get:
      operationId: getDiscordConfig
      tags: [discord]
      summary: Get saved bot configuration
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordConfig"
    put:
      operationId: saveDiscordConfig
      tags: [discord]
      summary: Save bot channel and update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordConfigInput"
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordConfig"
  /discord/sync:
    post:
      operationId: syncDiscordTable
      tags: [discord]
      summary: Sync the current catalog to Discord now
      responses:
        "200":
          description: Synchronization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
  /discord/status:
    get:
      operationId: getDiscordStatus
      tags: [discord]
      summary: Get bot synchronization status
      responses:
        "200":
          description: Synchronization status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SeasonItem:
      type: object
      required: [id, title, kind, status, imageUrl, url]
      properties:
        id: { type: number }
        title: { type: string }
        kind: { type: string, enum: [anime, manga] }
        status: { type: string, enum: [airing, upcoming, publishing] }
        imageUrl: { type: string }
        url: { type: string }
        score: { type: ["number", "null"] }
        episodes: { type: ["number", "null"] }
        volumes: { type: ["number", "null"] }
        synopsis: { type: ["string", "null"] }
        genres:
          type: array
          items: { type: string }
    SeasonCatalog:
      type: object
      required: [season, year, anime, manga, updatedAt]
      properties:
        season: { type: string }
        year: { type: number }
        anime:
          type: array
          items: { $ref: "#/components/schemas/SeasonItem" }
        manga:
          type: array
          items: { $ref: "#/components/schemas/SeasonItem" }
        updatedAt: { type: string, format: date-time }
    DiscordGuild:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        iconUrl: { type: ["string", "null"] }
    DiscordChannel:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
    DiscordConfig:
      type: object
      required: [guildId, channelId, intervalMinutes, includeAnime, includeManga, enabled]
      properties:
        guildId: { type: ["string", "null"] }
        channelId: { type: ["string", "null"] }
        intervalMinutes: { type: number }
        includeAnime: { type: boolean }
        includeManga: { type: boolean }
        enabled: { type: boolean }
        lastSyncedAt: { type: ["string", "null"], format: date-time }
        messageId: { type: ["string", "null"] }
    DiscordConfigInput:
      type: object
      required: [guildId, channelId, intervalMinutes, includeAnime, includeManga, enabled]
      properties:
        guildId: { type: string, minLength: 1 }
        channelId: { type: string, minLength: 1 }
        intervalMinutes: { type: number, minimum: 15, maximum: 10080 }
        includeAnime: { type: boolean }
        includeManga: { type: boolean }
        enabled: { type: boolean }
    SyncResult:
      type: object
      required: [success, message, updatedAt]
      properties:
        success: { type: boolean }
        message: { type: string }
        updatedAt: { type: string, format: date-time }
    DiscordStatus:
      type: object
      required: [configured, connected, enabled, lastSyncedAt]
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        enabled: { type: boolean }
        lastSyncedAt: { type: ["string", "null"], format: date-time }

