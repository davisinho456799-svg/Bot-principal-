openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: manga
    description: Manga search and chapter aggregation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /manga/aggregate:
    get:
      operationId: searchMangaAggregate
      tags: [manga]
      summary: Search manga using the primary chapter aggregator
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Comick-backed search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangaAggregate"
        "400":
          description: Invalid query
  /manga/comick/chapters:
    get:
      operationId: listComickChapters
      tags: [manga]
      summary: List chapters from Comick
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
            default: en
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Chapters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterList"
        "502":
          description: Comick unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MangaRecord:
      type: object
      required: [source, id, title, alternativeTitles, description, coverUrl, score, genres, status, chapters, year, country, url]
      properties:
        source:
          type: string
          enum: [comick, mangaupdates, mangadex, jikan, anilist]
        id: { type: string }
        title: { type: string }
        alternativeTitles:
          type: array
          items: { type: string }
        description: { type: ["string", "null"] }
        coverUrl: { type: ["string", "null"] }
        score: { type: ["number", "null"] }
        genres:
          type: array
          items: { type: string }
        status: { type: ["string", "null"] }
        chapters: { type: ["number", "null"] }
        year: { type: ["number", "null"] }
        country: { type: ["string", "null"] }
        url: { type: string }
    SourceStatus:
      type: object
      required: [source, status, count]
      properties:
        source:
          type: string
          enum: [comick, mangaupdates, mangadex, jikan, anilist]
        status:
          type: string
          enum: [ok, empty, error]
        count: { type: number }
        error: { type: string }
    MangaAggregate:
      type: object
      required: [query, primarySource, results, sources]
      properties:
        query: { type: string }
        primarySource:
          type: string
          enum: [comick]
        results:
          type: array
          items:
            $ref: "#/components/schemas/MangaRecord"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceStatus"
    Chapter:
      type: object
      required: [id, chapter, volume, title, language, publishedAt, url, group, source]
      properties:
        id: { type: string }
        chapter: { type: string }
        volume: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        language: { type: ["string", "null"] }
        publishedAt: { type: ["string", "null"] }
        url: { type: ["string", "null"] }
        group: { type: ["string", "null"] }
        source:
          type: string
          enum: [comick, mangadex]
    ChapterList:
      type: object
      required: [source, mangaId, chapters]
      properties:
        source:
          type: string
          enum: [comick, mangadex]
        mangaId: { type: string }
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"

