services:
  - type: worker
    name: panel-watch-discord-bot
    runtime: docker
    dockerfilePath: ./Dockerfile.discord
    dockerContext: .
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_BOT_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false